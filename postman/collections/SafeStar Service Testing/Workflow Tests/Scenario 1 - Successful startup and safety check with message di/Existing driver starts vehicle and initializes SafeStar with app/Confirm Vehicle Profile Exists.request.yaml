$kind: http-request
url: "{{baseUrl}}/vehicle/:id"
method: GET
pathVariables:
  id: "{{vehicleID}}"
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: |-
      const vinDecode = pm.require('npm:vin-decode@0.2.0');
      const qa_workshop_package = pm.require('@postvehicle-enterprise-team-70e5a999-e56b-4345-9ca0-340f9781/qa_workshop_package');
      pm.test("VIN is a validly-formatted string", function () {
          var jsonData = pm.response.json();
          console.log("Checking VIN: " + jsonData.vehicle.vin + " ...");
          pm.expect(jsonData.vehicle.vin).to.be.a.string;
          pm.expect(qa_workshop_package.isValidVIN(jsonData.vehicle.vin)).to.be.true;
          console.log("Decoding vin...");
          console.log(vinDecode(jsonData.vehicle.vin).decode());
      });
    language: text/javascript
    packages:
      npm:vin-decode@0.2.0:
        id: npm:vin-decode@0.2.0
      "@postvehicle-enterprise-team-70e5a999-e56b-4345-9ca0-340f9781/qa_workshop_package":
        id: 01a15d83-9e7e-7255-8b9f-2b88af7903f3
order: 2000
